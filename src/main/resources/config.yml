proxy-sync:
  enabled: false
  channel: "asyncmotd:sync"
  secret: ""

ping:
  enabled: true
  apply-motd: true
  apply-icon: true
  apply-hover: true
  apply-version: true
  legacy-named-colors: true
  legacy-overrides:
    "00d3ff": "aqua"
    "ff0000": "red"

gradient:
  enabled: true
  regex: "<gradient:(#[0-9a-fA-F]{6}(?::#[0-9a-fA-F]{6})+)>(.*?)</gradient>"
  color-separator: ":"
  color-format: "&#%s"
  keep-codes: "klmno"

center:
  enabled: true
  width: 270
  offset: -8
  space-width: 4
  default-width: 6
  bold-extra: 1
  reset-code: "&r"
  char-widths:
    "2": "!',.:;i|┇"
    "3": "`l∙│"
    "4": "\"()*I[]t{}ɪ⏴⏵◘◦"
    "5": "<>fk⌠⌡●"
    "7": "@~»√≈≡⏩⏪▶▷◀◁⛄✔✘❌🔥🪓"
    "8": "©←→⇄∞⌂⌚⌛⏳⏻░◎☂☃☄★☆☔☠☻♫♬⚐⚑⚓⚗⛨✂✉✎❄❤⭐⭘⯪⯫🔔🛡🧪🪣"
    "9": "▒▓☀☁☽⛈⛏🌊🌧🍖🎣🏹🔱🗡"
    "10": "☐☑☒☯⚠"

version:
  force-display: false
  protocol: -1

icons:
  folder: "icons"
  extension: ".png"

input:
  timeout-seconds: 60
  cancel-word: "cancel"
  clear-word: "none"
  id-pattern: "[a-zA-Z0-9_-]{1,32}"
  create-field: "create"

preset-fields:
  - "line-1"
  - "line-2"
  - "version"
  - "icon"

placeholders:
  online: "{online}"
  max: "{max}"

subcommands:
  list: "list"
  create: "create"
  delete: "delete"
  activate: "activate"
  line1: "line1"
  line2: "line2"
  version: "version"
  icon: "icon"
  hover: "hover"
  reload: "reload"

hover-actions:
  add: "add"
  remove: "remove"
  clear: "clear"
